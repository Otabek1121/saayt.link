<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>ORBEK</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f6;color:#17322f;font:16px/1.5 system-ui,sans-serif}header{background:#fff;border-bottom:1px solid #d6e2df}header>div,main{max-width:900px;margin:auto;padding:18px 22px}header>div,.bar,.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:25px;font-weight:850;letter-spacing:-1.3px;color:#006e65;text-decoration:none}header select{margin-inline-start:auto;width:auto}a{color:#006961}main{padding-block:32px 80px}h1{font-size:clamp(28px,5vw,42px);margin:0 0 20px;line-height:1.1;letter-spacing:-.035em}h2,h3{margin:0 0 12px;line-height:1.25}section,form{padding:clamp(16px,3vw,28px);border:1px solid #d6e2df;border-radius:16px;background:white;margin:18px 0}label{display:grid;gap:5px;font-weight:600;font-size:14px;margin-bottom:13px}input,select,button,.btn{font:inherit;border-radius:8px;border:1px solid #a3b9b5;background:white;color:#183c38;padding:10px 12px;min-height:44px}input,select{width:100%;min-width:0}button,.btn{cursor:pointer;text-decoration:none;font-weight:650}button.primary,.btn{background:#006e65;border-color:#006e65;color:white}button.danger{color:#942d26}button:disabled{opacity:.6;cursor:wait}.actions{margin-top:16px}.bar{justify-content:space-between;margin-bottom:8px}.bar h2{margin:0}.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #e4eae8}.row:last-child{border:0}.row img,.preview{width:64px;height:64px;object-fit:contain;background:#f4f7f6;border-radius:8px}.row div{flex:1;min-width:0;overflow-wrap:anywhere}.row small{display:block;color:#496860}.row strong{font-weight:650}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}.note{color:#4a6863;font-size:14px}#status:not(:empty){position:sticky;top:10px;background:#e3f2ed;color:#17463b;border:1px solid #acd3c7;border-radius:9px;padding:10px 15px;z-index:1}#status.error:not(:empty){background:#fff0ed;border-color:#e0b6af;color:#822e22}fieldset{border:0;margin:0;padding:0;min-width:0}:focus-visible{outline:3px solid #109e92;outline-offset:3px}[hidden]{display:none!important}@media(max-width:550px){.grid{grid-template-columns:1fr}.row{gap:8px}.row img{width:48px;height:48px}header>div,main{padding-inline:14px}}
</style></head><body><header><div><a class="brand" href="/orbek">ORBEK</a><a href="/orbek" data-t="store"></a><select id="lang" aria-label="Language"><option value="uz">O‘zbekcha</option><option value="ru">Русский</option><option value="en">English</option><option value="zh">中文</option><option value="hi">हिन्दी</option></select></div></header><main><h1 data-t="title"></h1><div id="status" role="status" aria-live="polite"></div><section id="guard" hidden><form id="phoneLogin"><label><span data-t="phone"></span><input id="loginPhone" type="tel" autocomplete="username" required></label><label><span data-t="password"></span><input id="loginPassword" type="password" autocomplete="current-password" required></label><button class="primary" data-t="login"></button></form><a class="btn" href="/signin-with-chatgpt?return_to=%2Forbek%2Fadmin" >Google</a></section><div id="panel" hidden><form id="setPassword" hidden><label><span data-t="newPass"></span><input type="password" id="newPassword" autocomplete="new-password" minlength="12" maxlength="128" required></label><button data-t="save"></button></form><button id="logout" hidden data-t="logout"></button><section><div class="bar"><h2 data-t="catalog"></h2><button class="primary" type="button" id="add" data-t="add"></button></div><label><span data-t="search"></span><input id="catalogSearch" type="search"></label><div id="list"></div></section>
<form id="editor" hidden><fieldset><h2 id="heading"></h2><div class="grid"><label><span data-t="category"></span><select id="category" required></select></label><label><span data-t="price"></span><input id="price" type="number" min="1" step="1" max="999999999999" required></label></div><label id="nameChoice"><span id="nameChoiceLabel"></span><select id="namePreset"></select></label><h3 data-t="names"></h3><div class="grid" id="names"></div><label><span data-t="photo"></span><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><img class="preview" id="preview" hidden alt=""><label><span data-t="gallery"></span><input id="gallery" type="file" multiple accept="image/jpeg,image/png,image/webp"></label><div id="galleryList"></div><div class="actions"><button class="primary" data-t="save"></button><button type="button" id="cancel" data-t="cancel"></button><button type="button" class="danger" id="remove" data-t="remove"></button></div></fieldset></form>
<form id="contacts"><fieldset><h2 data-t="contacts"></h2><label><span data-t="channel"></span><input id="channel" type="url" placeholder="https://t.me/…"></label><label>WhatsApp<input id="whatsapp" type="url" placeholder="https://wa.me/998…"></label><label><span data-t="manager"></span><input id="telegram" type="url" placeholder="https://t.me/…"></label><label><span data-t="phone"></span><input id="phone" type="tel" placeholder="+998…" pattern="\+[1-9][0-9]{6,14}"></label><label><span data-t="map"></span><input id="map" type="url" placeholder="https://…"></label><button class="primary" data-t="save"></button></fieldset></form></div></main><script defer src="/orbek/catalog-options.js"></script><script defer src="/orbek/admin.js"></script></body></html>
